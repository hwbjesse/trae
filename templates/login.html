<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - OPC客户管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 360px; }
        h1 { color: #333; font-size: 22px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 15px; }
        input { width: 100%; padding: 16px; border: 1px solid #e8e8e8; border-radius: 10px; font-size: 16px; }
        input:focus { outline: none; border-color: #1890ff; }
        .btn { width: 100%; padding: 16px; background: #1890ff; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #40a9ff; }
        .btn:active { transform: scale(0.98); }
        .flash { padding: 14px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; }
        .flash.error { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 OPC客户管理</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash error">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <label>账号</label>
                <input type="text" name="username" required autofocus autocomplete="off">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required autocomplete="off">
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
    </div>
</body>
</html>
